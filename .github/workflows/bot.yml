name: Bot

on:
  schedule:
    - cron: "5 * * * *"     # jede Stunde kurz nach der vollen Stunde (Turbo: Stundenkerzen, Dein Bot: abends)
  workflow_dispatch:         # "Run workflow"-Knopf zum Starten von Hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.seite.outputs.page_url }}
    env:
      TZ: Europe/Berlin
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install yfinance pandas

      - name: Bots laufen lassen
        run: |
          python melden.py vorher
          python paper_bot.py
          python melden.py nachher

      - name: App-Seite bauen
        run: |
          python seite_bauen.py
          mkdir -p seite
          cp bot_seite.html seite/index.html
          cp app_symbol.png seite/apple-touch-icon.png

      - name: Depot speichern
        run: |
          git config user.name "Paper-Bot"
          git config user.email "bot@users.noreply.github.com"
          # Alle Depots und Logs aller Bots speichern (auch neue Bots ohne Änderung hier)
          for f in *.json *_log.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "Bot-Lauf $(date +'%d.%m.%Y %H:%M')"
          # Falls du während des Laufs etwas hochgeladen hast: erst holen, dann speichern
          for versuch in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
          if git status -sb | head -1 | grep -q ahead; then echo "Depot konnte nicht gespeichert werden"; exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: seite
      - name: App veröffentlichen
        id: seite
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # Manchmal findet GitHub die gerade hochgeladene Seite noch nicht: kurz warten und noch mal
      - name: Kurz warten
        if: steps.seite.outcome == 'failure'
        run: sleep 30
      - name: App veröffentlichen (2. Versuch)
        id: seite2
        if: steps.seite.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fehler melden
        if: failure()
        run: python melden.py fehler
